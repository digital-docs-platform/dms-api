services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin123"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web konzola (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    container_name: api
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultLocalConnection: "Server=sqlserver,1433;Database=DmsDb;User Id=sa;Password=YourStrong!Passw0rd123;TrustServerCertificate=True;Encrypt=False;"
      MinIo__ServiceUrl: "http://minio:9000"
      MinIo__AccessKey: "minioadmin"
      MinIo__SecretKey: "minioadmin123"
      MinIo__Bucket: "documents"
      MinIo__ForcePathStyle: "true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  sqlserver_data:
  minio_data:
